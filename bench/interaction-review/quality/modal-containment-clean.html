<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Lesson activity</title></head><body><main><h1>Lesson activity</h1><button id="openDialog">Edit reminder</button><dialog id="editor" aria-labelledby="dialogTitle"><h2 id="dialogTitle">Reminder</h2><label>Reminder text <input id="reminder"></label><button id="closeDialog">Save</button></dialog><a href="#footer">Help</a><p id="footer">Lesson help</p><script>openDialog.onclick=()=>editor.showModal();closeDialog.onclick=()=>editor.close();editor.onkeydown=e=>{if(e.key==='Tab'&&e.shiftKey&&document.activeElement===reminder){e.preventDefault();closeDialog.focus();}else if(e.key==='Tab'&&!e.shiftKey&&document.activeElement===closeDialog){e.preventDefault();reminder.focus();}};editor.showModal();</script></main></body></html>
