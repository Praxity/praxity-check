<html lang="en"><head><meta charset="utf-8"><title>Lesson activity</title></head><body><main><h1>Lesson activity</h1><div id="toggle" role="button" tabindex="0" aria-expanded="false">Explanation</div><p id="hint" hidden>Use the same operation on both sides.</p><script>function flip(){hint.hidden=!hint.hidden;toggle.setAttribute('aria-expanded',String(!hint.hidden));}toggle.onclick=flip;toggle.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}};</script></main></body></html>
