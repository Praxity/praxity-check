name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Keep internal notes out of the public repository
        shell: bash
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked" ]; then
            echo "::error::These tracked files match .gitignore. Move internal notes to the private research repository."
            echo "$tracked"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:bench
      - run: pnpm test:package
      - name: Smoke-test automated checks and interaction review
        shell: bash
        run: |
          mkdir -p /tmp/praxity-check-smoke/defect /tmp/praxity-check-smoke/clean
          cp bench/wcag/focus-indicator-removed/defect.html /tmp/praxity-check-smoke/defect/
          cp bench/wcag/focus-indicator-removed/clean.html /tmp/praxity-check-smoke/clean/
          set +e
          node src/cli.ts check /tmp/praxity-check-smoke/defect --min-confidence medium >/tmp/praxity-check-defect.txt
          defect_code=$?
          set -e
          test "$defect_code" -eq 1
          node src/cli.ts check /tmp/praxity-check-smoke/clean --min-confidence medium >/tmp/praxity-check-clean.txt
          node src/cli.ts prepare-review bench/interaction-review/tabs >/tmp/praxity-check-review.md

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - name: PDF and component tests
        run: node --test test/pdf*.test.ts test/components.test.ts test/setup.test.ts
      - name: Build and test the standalone Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeExe = (Get-Command node).Source
          $nodeDist = Join-Path $env:RUNNER_TEMP 'check-node'
          New-Item -ItemType Directory $nodeDist | Out-Null
          Copy-Item $nodeExe "$nodeDist/node.exe"
          $version = & $nodeExe -p 'process.version'
          Invoke-WebRequest "https://raw.githubusercontent.com/nodejs/node/$version/LICENSE" -OutFile "$nodeDist/LICENSE"
          $env:CHECK_NODE_DIST = $nodeDist
          corepack pnpm test:package
          if ($LASTEXITCODE -ne 0) { throw 'Package tests failed' }
          node scripts/package.mjs --platform win32 --arch x64 --node $nodeDist --output "$env:RUNNER_TEMP/check"
          if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
      - name: Install components and prove the package with only Node on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = "$env:RUNNER_TEMP/check"
          $nodeExe = "$artifact/runtime/node.exe"
          $env:CHECK_COMPONENTS_DIR = "$env:RUNNER_TEMP/check-components"
          foreach ($name in @('JAVA_HOME', 'JAVACMD', 'VERAPDF', 'VERAPDF_JAVA', 'VERAPDF_CLASSPATH', 'PLAYWRIGHT_BROWSERS_PATH')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $originalPath = $env:PATH
          try {
            $env:PATH = "$artifact/runtime"
            & "$artifact/bin/praxity-check.cmd" setup --yes pdf html
            if ($LASTEXITCODE -ne 0) { throw 'Setup failed' }
            & "$artifact/bin/praxity-check.cmd" doctor --json
            if ($LASTEXITCODE -ne 0) { throw 'Doctor failed' }
            & "$artifact/bin/praxity-check.cmd" check test/fixtures/pdf-facts.pdf --checks accessibility --tier deterministic --json "$env:RUNNER_TEMP/pdf-report.json"
            if ($LASTEXITCODE -ne 1) { throw 'PDF fixture must report accessibility findings' }
          } finally { $env:PATH = $originalPath }
          $env:CHECK_ARTIFACT = $artifact
          corepack pnpm test:package
          if ($LASTEXITCODE -ne 0) { throw 'Installed-component package proof failed' }

  posix-package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-package
            runner: macos-latest
            platform: darwin
            arch: arm64
          - name: linux-package
            runner: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Install Linux browser system libraries
        if: runner.os == 'Linux'
        run: corepack pnpm exec playwright install-deps chromium
      - run: corepack pnpm typecheck
      - name: PDF and component tests
        run: node --test test/pdf*.test.ts test/components.test.ts test/setup.test.ts
      - name: Build and test the standalone package
        shell: bash
        env:
          CHECK_PLATFORM: ${{ matrix.platform }}
          CHECK_ARCH: ${{ matrix.arch }}
        run: |
          node_dist="$RUNNER_TEMP/check-node"
          mkdir -p "$node_dist/bin"
          cp "$(command -v node)" "$node_dist/bin/node"
          version=$(node -p 'process.version')
          curl --fail --location "https://raw.githubusercontent.com/nodejs/node/$version/LICENSE" --output "$node_dist/LICENSE"
          export CHECK_NODE_DIST="$node_dist"
          corepack pnpm test:package
          node scripts/package.mjs --platform "$CHECK_PLATFORM" --arch "$CHECK_ARCH" --node "$node_dist" --output "$RUNNER_TEMP/check"
      - name: Isolate macOS from preinstalled Java
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # java_home discovers JDKs independently of PATH. Move runner-provided JDKs
          # aside so this job proves the pinned JRE download and extraction too.
          mkdir "$RUNNER_TEMP/system-java"
          for directory in /Library/Java/JavaVirtualMachines/* "$HOME/Library/Java/JavaVirtualMachines/"*; do
            if [ -e "$directory" ]; then
              sudo mv "$directory" "$RUNNER_TEMP/system-java/"
            fi
          done
      - name: Install components and prove the package with only Node on PATH
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/check"
          export CHECK_COMPONENTS_DIR="$(mktemp -d "$RUNNER_TEMP/check-components.XXXXXX")"
          mkdir "$RUNNER_TEMP/check-clean"
          cp bench/wcag/focus-indicator-removed/clean.html "$RUNNER_TEMP/check-clean/"
          unset JAVA_HOME JAVACMD VERAPDF VERAPDF_JAVA VERAPDF_CLASSPATH PLAYWRIGHT_BROWSERS_PATH PLAYWRIGHT_HOST_PLATFORM_OVERRIDE
          unset npm_config_playwright_browsers_path npm_package_config_playwright_browsers_path
          original_path="$PATH"
          export PATH="$artifact/runtime"
          expect_exit() {
            label="$1"
            expected="$2"
            shift 2
            code=0
            "$@" || code=$?
            echo "$label exit code: $code" >&2
            test "$code" -eq "$expected"
          }
          expect_exit setup 0 "$artifact/bin/praxity-check" setup --yes pdf html
          expect_exit doctor 0 "$artifact/bin/praxity-check" doctor --json >"$RUNNER_TEMP/doctor.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const text = readFileSync(`${process.env.RUNNER_TEMP}/doctor.json`, 'utf8');
          console.log(text);
          const doctor = JSON.parse(text);
          assert.deepEqual(doctor.components.map(component => component.id).sort(), ['browser', 'java', 'verapdf']);
          for (const component of doctor.components) {
            assert.equal(component.usable, true, component.id);
            assert.equal(component.source, 'setup', component.id);
            assert.equal(component.pinned, true, component.id);
            assert.equal(component.inventory, 'intact', component.id);
          }
          NODE
          expect_exit PDF 1 "$artifact/bin/praxity-check" check test/fixtures/pdf-facts.pdf --checks accessibility --tier deterministic --json "$RUNNER_TEMP/pdf-report.json"
          expect_exit HTML 0 "$artifact/bin/praxity-check" check "$RUNNER_TEMP/check-clean" --min-confidence medium --json "$RUNNER_TEMP/html-report.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pdf = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pdf-report.json`, 'utf8'));
          assert.equal(pdf.machineStatus, 'complete');
          assert.equal(pdf.pdfuaValidation.profile, 'ua1');
          assert.equal(pdf.pdfuaValidation.coverage.status, 'complete');
          assert.ok(pdf.findings.length > 0);
          const html = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/html-report.json`, 'utf8'));
          assert.equal(html.pages.length, 1);
          assert.ok(html.pages.every(page => page.audited));
          assert.equal(html.environment.components[0].source, 'setup');
          console.log('PDF/UA validation complete; clean HTML page audited with the setup browser');
          NODE
          export PATH="$original_path"
          export CHECK_NODE_DIST="$RUNNER_TEMP/check-node"
          export CHECK_ARTIFACT="$artifact"
          corepack pnpm test:package
