name: Review keyboard probe
on:
  pull_request:
  workflow_dispatch:
jobs:
  review-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - name: Run unchanged PR tests and independent probes on head and reverted source
        run: node review-variants.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-review-evidence
          path: review-evidence/