name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Keep internal notes out of the public repository
        shell: bash
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked" ]; then
            echo "::error::These tracked files match .gitignore. Move internal notes to the private research repository."
            echo "$tracked"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:bench
      - run: pnpm test:package
      - name: Smoke-test automated checks and interaction review
        shell: bash
        run: |
          mkdir -p /tmp/praxity-check-smoke/defect /tmp/praxity-check-smoke/clean
          cp bench/wcag/focus-indicator-removed/defect.html /tmp/praxity-check-smoke/defect/
          cp bench/wcag/focus-indicator-removed/clean.html /tmp/praxity-check-smoke/clean/
          set +e
          node src/cli.ts check /tmp/praxity-check-smoke/defect --min-confidence medium >/tmp/praxity-check-defect.txt
          defect_code=$?
          set -e
          test "$defect_code" -eq 1
          node src/cli.ts check /tmp/praxity-check-smoke/clean --min-confidence medium >/tmp/praxity-check-clean.txt
          node src/cli.ts prepare-review bench/interaction-review/tabs --reviewer manual >/tmp/praxity-check-review.md

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - name: CLI entry points through directory symlinks
        run: node --test --test-name-pattern="CLI entry points run through directory symlinks" scripts/package.test.mjs
      - name: PDF and component tests
        run: node --test test/pdf*.test.ts test/components.test.ts test/setup.test.ts
      - name: Pack and install into a clean npm project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:npm_config_cache = "$env:RUNNER_TEMP/check-npm-cache"
          $env:npm_config_prefix = "$env:RUNNER_TEMP/check-npm-prefix"
          npm pack --pack-destination "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/check-install" | Out-Null
          Set-Location "$env:RUNNER_TEMP/check-install"
          npm init --yes
          if ($LASTEXITCODE -ne 0) { throw 'npm init failed' }
          npm install (Get-ChildItem "$env:RUNNER_TEMP/praxity-check-*.tgz").FullName
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
      - name: Prove the installed npm package with only Node on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeDir = Split-Path (Get-Command node).Source
          $env:npm_config_cache = "$env:RUNNER_TEMP/check-npm-cache"
          $env:npm_config_prefix = "$env:RUNNER_TEMP/check-npm-prefix"
          $env:CHECK_COMPONENTS_DIR = "$env:RUNNER_TEMP/check-components"
          New-Item -ItemType Directory "$env:RUNNER_TEMP/check-clean" | Out-Null
          Copy-Item bench/wcag/focus-indicator-removed/clean.html "$env:RUNNER_TEMP/check-clean/"
          $pdf = "$env:GITHUB_WORKSPACE/test/fixtures/pdf-facts.pdf"
          foreach ($name in @('JAVA_HOME', 'JAVACMD', 'VERAPDF', 'VERAPDF_JAVA', 'VERAPDF_CLASSPATH', 'PLAYWRIGHT_BROWSERS_PATH', 'PLAYWRIGHT_HOST_PLATFORM_OVERRIDE', 'npm_config_playwright_browsers_path', 'npm_package_config_playwright_browsers_path')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          Set-Location "$env:RUNNER_TEMP/check-install"
          $env:PATH = $nodeDir
          npx --no-install praxity-check --help
          if ($LASTEXITCODE -ne 0) { throw 'Help failed' }
          npx --no-install praxity-check setup --yes pdf html
          if ($LASTEXITCODE -ne 0) { throw 'Setup failed' }
          npx --no-install praxity-check doctor --json | Out-File -Encoding utf8 "$env:RUNNER_TEMP/doctor.json"
          if ($LASTEXITCODE -ne 0) { throw 'Doctor failed' }
          npx --no-install praxity-check check $pdf --checks accessibility --tier deterministic --json "$env:RUNNER_TEMP/pdf-report.json"
          if ($LASTEXITCODE -ne 1) { throw 'PDF fixture must report accessibility findings' }
          npx --no-install praxity-check check "$env:RUNNER_TEMP/check-clean" --min-confidence medium --json "$env:RUNNER_TEMP/html-report.json"
          if ($LASTEXITCODE -ne 0) { throw 'HTML audit failed' }
          node "$env:GITHUB_WORKSPACE/scripts/verify-npm-smoke.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Report assertions failed' }
          $env:CHECK_NPM_INSTALL = "$env:RUNNER_TEMP/check-install"
          node --test --test-name-pattern='installed npm package' "$env:GITHUB_WORKSPACE/scripts/package.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Installed npm audit tests failed' }

  posix-package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-package
            runner: macos-latest
          - name: linux-package
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Install Linux browser system libraries
        if: runner.os == 'Linux'
        run: corepack pnpm exec playwright install-deps chromium
      - run: corepack pnpm typecheck
      - name: CLI entry points through directory symlinks
        run: node --test --test-name-pattern="CLI entry points run through directory symlinks" scripts/package.test.mjs
      - name: PDF and component tests
        run: node --test test/pdf*.test.ts test/components.test.ts test/setup.test.ts
      - name: Pack and install into a clean npm project
        shell: bash
        run: |
          export npm_config_cache="$RUNNER_TEMP/check-npm-cache"
          export npm_config_prefix="$RUNNER_TEMP/check-npm-prefix"
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/check-install"
          cd "$RUNNER_TEMP/check-install"
          npm init --yes
          npm install "$RUNNER_TEMP"/praxity-check-*.tgz
      - name: Isolate macOS from preinstalled Java
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # java_home discovers JDKs independently of PATH. Move runner-provided JDKs
          # aside so this job proves the pinned JRE download and extraction too.
          mkdir "$RUNNER_TEMP/system-java"
          for directory in /Library/Java/JavaVirtualMachines/* "$HOME/Library/Java/JavaVirtualMachines/"*; do
            if [ -e "$directory" ]; then
              sudo mv "$directory" "$RUNNER_TEMP/system-java/"
            fi
          done
      - name: Prove the installed npm package with only Node on PATH
        shell: bash
        run: |
          node_dir="$(dirname "$(command -v node)")"
          export npm_config_cache="$RUNNER_TEMP/check-npm-cache"
          export npm_config_prefix="$RUNNER_TEMP/check-npm-prefix"
          export CHECK_COMPONENTS_DIR="$(mktemp -d "$RUNNER_TEMP/check-components.XXXXXX")"
          mkdir "$RUNNER_TEMP/check-clean"
          cp bench/wcag/focus-indicator-removed/clean.html "$RUNNER_TEMP/check-clean/"
          unset JAVA_HOME JAVACMD VERAPDF VERAPDF_JAVA VERAPDF_CLASSPATH PLAYWRIGHT_BROWSERS_PATH PLAYWRIGHT_HOST_PLATFORM_OVERRIDE
          unset npm_config_playwright_browsers_path npm_package_config_playwright_browsers_path
          cd "$RUNNER_TEMP/check-install"
          export npm_config_script_shell=/bin/sh
          export PATH="$node_dir"
          expect_exit() {
            label="$1"
            expected="$2"
            shift 2
            code=0
            "$@" || code=$?
            echo "$label exit code: $code" >&2
            test "$code" -eq "$expected"
          }
          expect_exit help 0 npx --no-install praxity-check --help
          expect_exit setup 0 npx --no-install praxity-check setup --yes pdf html
          expect_exit doctor 0 npx --no-install praxity-check doctor --json >"$RUNNER_TEMP/doctor.json"
          expect_exit PDF 1 npx --no-install praxity-check check "$GITHUB_WORKSPACE/test/fixtures/pdf-facts.pdf" --checks accessibility --tier deterministic --json "$RUNNER_TEMP/pdf-report.json"
          expect_exit HTML 0 npx --no-install praxity-check check "$RUNNER_TEMP/check-clean" --min-confidence medium --json "$RUNNER_TEMP/html-report.json"
          node "$GITHUB_WORKSPACE/scripts/verify-npm-smoke.mjs"
          export CHECK_NPM_INSTALL="$RUNNER_TEMP/check-install"
          node --test --test-name-pattern='installed npm package' "$GITHUB_WORKSPACE/scripts/package.test.mjs"
