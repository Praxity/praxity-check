name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:bench
      - run: pnpm test:package
      - name: Smoke-test automated checks and interaction review
        shell: bash
        run: |
          mkdir -p /tmp/praxity-check-smoke/defect /tmp/praxity-check-smoke/clean
          cp bench/wcag/focus-indicator-removed/defect.html /tmp/praxity-check-smoke/defect/
          cp bench/wcag/focus-indicator-removed/clean.html /tmp/praxity-check-smoke/clean/
          set +e
          node src/cli.ts check /tmp/praxity-check-smoke/defect --min-confidence medium >/tmp/praxity-check-defect.txt
          defect_code=$?
          set -e
          test "$defect_code" -eq 1
          node src/cli.ts check /tmp/praxity-check-smoke/clean --min-confidence medium >/tmp/praxity-check-clean.txt
          node src/cli.ts prepare-review bench/interaction-review/tabs >/tmp/praxity-check-review.md
